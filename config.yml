clan_storage:
  default_size: 27 # Must be multiple of 9, max 54. (e.g., 9, 18, 27, 36, 45, 54)
  fill_new_storage_with_filler_item: false # Set to true to enable
  filler_item:
    material: "GRAY_STAINED_GLASS_PANE"
    name: "&7 " # A space or some other non-functional name
    lore:
      - "&7This slot is decorative."
      # - "&7More lore lines if needed."

placeholderapi:
  no_clan_name: ["No Clan"]
  pvp_status_no_clan: ["N/A"]
  leader_name_unknown: ["Unknown"]
  leader_name_no_clan: ["No Clan"]
