  unknown_subcommand: ["&cUnknown subcommand. Use /clan help."]

  clan_create_usage: ["&cUsage: /clan create <name>"]
  clan_name_length: ["&cClan name must be between 3 and 16 characters."]
  clan_name_invalid_chars: ["&cClan name can only contain letters, numbers, and underscores."]
  clan_name_taken: ["&cThat clan name is already taken."]
  already_in_clan: ["&cYou are already in a clan."]
  clan_created: ["&#32a852Your clan &b{clan_name}&#32a852 has been created!"]

  not_in_clan: ["&cYou are not in a clan."]
  player_not_online: ["&cPlayer {player_name} is not online."]

  not_clan_leader: ["&cOnly the clan leader can do that."]

  cannot_invite_self: ["&cYou cannot invite yourself."]
  invite_already_member: ["&c{player_name} is already in your clan."]
  invite_player_in_another_clan: ["&c{player_name} is already in another clan."]
  invite_already_pending: ["&cAn invite to {clan_name} for {player_name} is already pending."]
  invite_sent: ["&aInvite sent to {player_name} to join {clan_name}."]

  invite_received_base:
    - "&6You have been invited to join clan &e{clan_name}&6 by &e{inviter_name}&6."
  invite_received_instructions:
    - "&7Click the buttons above or type &e/clan accept {clan_name} &7or &e/clan decline {clan_name}&7."

  invite_button_accept_text:
    - "&8[&aAccept&8]"
  invite_button_accept_hover:
    - "&aClick to accept the invitation from &e{clan_name}&a."
  invite_button_decline_text:
    - "&8[&cDecline&8]"
  invite_button_decline_hover:
    - "&cClick to decline the invitation from &e{clan_name}&c."

  invite_none_pending: ["&cYou have no pending clan invitations."]
  invite_not_found_for_clan: ["&cYou don't have an invite from clan {clan_name}."]
  clan_disbanded_on_accept: ["&cThe clan {clan_name} seems to have been disbanded."]
  already_in_clan_on_accept: ["&cYou joined another clan before accepting this invite."]
  player_joined_clan: ["&#74c72c{player_name} has joined the clan!"]
  invite_accepted: ["&#74c72cYou have joined clan {clan_name}!"]
  invite_declined_to_inviter: ["&e{player_name} declined your invitation to join {clan_name}."]
  invite_declined: ["&aYou have declined the invitation from clan {clan_name}."]

  clan_invite_usage: ["&cUsage: /clan invite <player>"]
  clan_accept_usage: ["&cUsage: /clan accept <clan_name>"]
  clan_decline_usage: ["&cUsage: /clan decline <clan_name>"]

  not_in_clan_for_chat_toggle: ["&cYou must be in a clan to toggle clan chat."]
  not_in_clan_to_chat: ["&cYou must be in a clan to use clan chat."]
  clan_chat_toggled_on: ["&#62f569Clan chat toggled &2ON&a. Your messages will now go to your clan."]
  clan_chat_toggled_off: ["&#f59e62Clan chat toggled &cOFF&a. Your messages will now go to public chat."]
  clan_chat_format: ["&8[&2{clan_name}&8] &a{player_name}: &7{message}"]

  no_pvp_toggle_permission: ["&cOnly the clan leader can toggle PvP status."]
  clan_pvp_enabled: ["&#c91818Clan PvP has been &aENABLED&c for {clan_name}."]
  clan_pvp_disabled: ["&#c91818Clan PvP has been &cDISABLED&c for {clan_name}."]
  pvp_disabled_feedback_attacker: ["&cFriendly fire is off in your clan!"]

  clan_storage_title: ["&2Clan Storage: &a{clan_name}"]
  clan_storage_saved: ["&aClan storage saved."]

  # Help System Messages
  clan_help_header: ["&e--- TempleGuild Clan Help ---"]
  clan_help_footer: ["&e--- Type /clan help <command> for more info ---"]
  clan_help_format:
    - "&6/clan {command} {arguments} &7- {description}"
  clan_help_unavailable: ["&cHelp information is currently unavailable. Please contact an administrator."]
  players_only_for_most_commands: ["&cMost clan commands must be run by a player. Console can use /clan help."]

  clan_help_entries:
    create:
      arguments: "<name>"
      description: "Creates a new clan."
      permission: "templeguild.clan.create"
    invite:
      arguments: "<player>"
      description: "Invites a player to your clan."
      permission: "templeguild.clan.invite"
    accept:
      arguments: "<clan_name>"
      description: "Accepts a pending clan invitation."
      permission: "templeguild.clan.accept"
    decline:
      arguments: "<clan_name>"
      description: "Declines a pending clan invitation."
      permission: "templeguild.clan.decline"
    chat:
      arguments: "[message]"
      description: "Sends a message to clan chat, or toggles chat mode."
      permission: "templeguild.clan.chat"
    pvp:
      arguments: ""
      description: "Toggles clan PvP status (leader only)."
      permission: "templeguild.clan.pvp.toggle"
    storage:
      arguments: ""
      description: "Opens the shared clan storage."
      permission: "templeguild.clan.storage.access"
    help:
      arguments: "[command]"
      description: "Shows this help message or help for a specific command."
      permission: ""


