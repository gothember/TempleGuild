    - "&e{player_name} has left the clan."

  clan_not_found_for_disband:
    - "&cClan &e{clan_name}&c not found."
  clan_disband_success:
    - "&aClan &e{clan_name}&a has been successfully disbanded."
  clan_disbanded_notification_members:
    - "&cYour clan, &e{clan_name}&c, has been disbanded by the leader or system."

  clan_kick_usage:
    - "&cUsage: /clan kick <player>"
  clan_kick_no_leader_permission:
    - "&cOnly the clan leader can kick members."
  player_not_online_to_kick:
    - "&cPlayer {player_name} is not online to be kicked."
  clan_kick_cannot_kick_self:
    - "&cYou cannot kick yourself from the clan. Use /clan leave instead."
  clan_kick_target_not_in_your_clan:
    - "&cPlayer {target_player_name} is not a member of your clan."
  clan_kick_cannot_kick_leader:
    - "&cYou cannot kick the clan leader."
  clan_kick_success_kicker:
    - "&aYou have successfully kicked {target_player_name} from clan {clan_name}."
  clan_kick_notification_kicked_player:
    - "&cYou have been kicked from clan {clan_name} by {kicker_name}."
  clan_kick_notification_members:
    - "&e{target_player_name} has been kicked from the clan by {kicker_name}."

  # Help System Messages
  clan_help_header: ["&e--- TempleGuild Clan Help ---"]
  clan_help_footer: ["&e--- Type /clan help <command> for more info ---"]
  clan_help_format:
    - "&6/clan {command} {arguments} &7- {description}"
  clan_help_unavailable: ["&cHelp information is currently unavailable. Please contact an administrator."]
  players_only_for_most_commands: ["&cMost clan commands must be run by a player. Console can use /clan help."]

  clan_help_entries:
    create:
      arguments: "<name>"
      description: "Creates a new clan."
      permission: "templeguild.clan.create"
    invite:
      arguments: "<player>"
      description: "Invites a player to your clan."
      permission: "templeguild.clan.invite"
    accept:
      arguments: "<clan_name>"
      description: "Accepts a pending clan invitation."
      permission: "templeguild.clan.accept"
    decline:
      arguments: "<clan_name>"
      description: "Declines a pending clan invitation."
      permission: "templeguild.clan.decline"
    chat:
      arguments: "[message]"
      description: "Sends a message to clan chat, or toggles chat mode."
      permission: "templeguild.clan.chat"
    pvp:
      arguments: ""
      description: "Toggles clan PvP status (leader only)."
      permission: "templeguild.clan.pvp.toggle"
    storage:
      arguments: ""
      description: "Opens the shared clan storage."
      permission: "templeguild.clan.storage.access"
    help:
      arguments: "[command]"
      description: "Shows this help message or help for a specific command."
      permission: ""
      leave: # New entry
        arguments: "" # No arguments
        description: "Leave your current clan."
        permission: "templeguild.clan.leave"
      kick: # New entry
        arguments: "<player>"
        description: "Kicks a player from your clan (leader only)."
        permission: "templeguild.clan.kick"


