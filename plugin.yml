name: TempleGuild
version: 1.0.0
main: ru.templeguild.TempleGuild
api-version: 1.16
author: YourName # Or Jules
description: A clan plugin for Paper 1.16.5+
softdepend: [PlaceholderAPI]
commands:
  clan:
    description: Main command for clan management.
    usage: /clan help
    aliases: [c, cl] # Optional aliases
permissions:
  templeguild.clan.create:
    description: Allows creating a new clan.
    default: op
  templeguild.clan.invite:
    description: Allows inviting players to a clan.
    default: op
  templeguild.clan.accept:
    description: Allows accepting clan invitations.
    default: true
  templeguild.clan.decline:
    description: Allows declining clan invitations.
    default: true
  templeguild.clan.chat:
    description: Allows using clan chat and toggling clan chat mode.
    default: true
  templeguild.clan.pvp.toggle:
    description: Allows toggling clan PvP status (leader only by default).
    default: op
  templeguild.clan.storage.access:
    description: Allows opening and using the clan storage.
    default: true # Or op, or based on clan rank later
  templeguild.clan.leave:
    description: Allows a player to leave their current clan.
    default: true
  templeguild.clan.kick:
    description: Allows a clan leader (or authorized role) to kick a member.
    default: op # Or just 'op' if only leaders via logic for now
  templeguild.clan.disband:
    description: Allows a clan leader to disband their clan.
    default: op
  templeguild.clan.top:
    description: Allows viewing the top clans by kills.
    default: true
  # Add more permissions as commands are implemented
